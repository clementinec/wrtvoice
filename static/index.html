<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socratic Method Bot - Upload Essay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 48px;
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 40px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 48px 24px;
            margin-bottom: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f1ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8e9ff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .upload-text {
            color: #333;
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .upload-hint {
            color: #666;
            font-size: 14px;
        }

        #fileInput {
            display: none;
        }

        .file-info {
            background: #f0f1ff;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            display: none;
        }

        .file-info.visible {
            display: block;
        }

        .file-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .file-details {
            color: #666;
            font-size: 14px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 48px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 16px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn.secondary {
            background: #eef0f5;
            color: #333;
            margin-top: 10px;
        }

        .btn.secondary:hover:not(:disabled) {
            box-shadow: 0 8px 24px rgba(68, 76, 96, 0.16);
        }

        .btn.hidden {
            display: none;
        }

        .loading {
            display: none;
            margin: 24px 0;
        }

        .loading.visible {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #666;
            font-size: 14px;
        }

        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }

        .error.visible {
            display: block;
        }

        .success {
            background: #efe;
            border: 1px solid #cfc;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }

        .success.visible {
            display: block;
        }

        .notice {
            background: #fff8e6;
            border: 1px solid #f3d27b;
            color: #7a5600;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
            font-size: 14px;
            line-height: 1.4;
        }

        .notice.visible {
            display: block;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-indicator.active {
            background: #3c3;
        }

        .status-indicator.inactive {
            background: #c33;
        }

        .footer {
            margin-top: 32px;
            color: #999;
            font-size: 12px;
            line-height: 1.5;
        }

        .footer-action {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
            margin-left: 6px;
            padding: 0;
        }

        .footer-command {
            color: #666;
            display: block;
            margin-top: 4px;
        }

        .mode-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
            text-align: left;
        }

        .mode-option {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-option:has(input:checked) {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .mode-option input {
            margin-right: 8px;
        }

        .mode-title {
            color: #333;
            font-weight: 600;
        }

        .mode-hint {
            color: #777;
            display: block;
            font-size: 12px;
            margin-top: 6px;
        }

        .voice-settings.hidden {
            display: none;
        }

        .model-settings {
            margin-top: 16px;
            text-align: left;
        }

        .model-settings label {
            color: #666;
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .model-select {
            border: 1px solid #ddd;
            border-radius: 8px;
            color: #333;
            font: inherit;
            padding: 10px 12px;
            width: 100%;
        }

        .model-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
            outline: none;
        }

        .model-hint {
            color: #777;
            font-size: 12px;
            line-height: 1.4;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Socratic Method Bot</h1>
        <p class="subtitle">Upload your essay to edit, revise, or practice defending it</p>

        <div class="error" id="errorMsg"></div>
        <div class="success" id="successMsg"></div>
        <div class="notice" id="contextNotice"></div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📄</div>
            <div class="upload-text">Click to upload or drag & drop your essay</div>
            <div class="upload-hint">PDF files only, max 10MB</div>
        </div>

        <input type="file" id="fileInput" accept=".pdf">

        <div class="file-info" id="fileInfo">
            <div class="file-name" id="fileName"></div>
            <div class="file-details" id="fileDetails"></div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Processing PDF...</div>
        </div>

        <div class="mode-selector" aria-label="Session mode">
            <label class="mode-option">
                <input type="radio" name="sessionMode" value="text" checked>
                <span class="mode-title">Text editing</span>
                <span class="mode-hint">Ask for revisions, structure, clarity, or feedback.</span>
            </label>
            <label class="mode-option">
                <input type="radio" name="sessionMode" value="voice">
                <span class="mode-title">Voice</span>
                <span class="mode-hint">Uses the server machine microphone.</span>
            </label>
        </div>

        <div class="model-settings">
            <label for="ollamaModel">LLM model</label>
            <select class="model-select" id="ollamaModel"></select>
            <p class="model-hint" id="modelHint">Checking installed Ollama models...</p>
        </div>

        <div class="voice-settings hidden" id="voiceSettings" style="margin-top: 16px; text-align: left;">
            <label style="color: #666; font-size: 14px; display: block; margin-bottom: 8px;">
                Pause detection timeout (seconds):
            </label>
            <input type="range" id="phraseTimeout" min="4" max="10" step="0.5" value="5.0"
                   style="width: 100%;" oninput="this.nextElementSibling.textContent = this.value + 's'">
            <span style="color: #667eea; font-weight: 600;">5.0s</span>
            <p style="font-size: 12px; color: #999; margin-top: 4px;">
                Lower = faster responses, Higher = more patient listening
            </p>
        </div>

        <button class="btn" id="startBtn" disabled>Start Session</button>
        <button class="btn secondary hidden" id="resumeBtn" type="button">Resume Active Session</button>

        <div class="footer">
            <span class="status-indicator inactive" id="ollamaStatus"></span>
            <span id="ollamaText">Checking Ollama...</span>
            <button class="footer-action" id="recheckBtn" type="button">Recheck</button>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileDetails = document.getElementById('fileDetails');
        const startBtn = document.getElementById('startBtn');
        const loading = document.getElementById('loading');
        const loadingText = document.getElementById('loadingText');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const contextNotice = document.getElementById('contextNotice');
        const ollamaStatus = document.getElementById('ollamaStatus');
        const ollamaText = document.getElementById('ollamaText');
        const recheckBtn = document.getElementById('recheckBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const modeInputs = document.querySelectorAll('input[name="sessionMode"]');
        const voiceSettings = document.getElementById('voiceSettings');
        const ollamaModel = document.getElementById('ollamaModel');
        const modelHint = document.getElementById('modelHint');

        let uploadedFile = null;
        let isPdfReady = false;
        let isOllamaReady = false;
        let activeSessionMode = null;
        let isBusy = false;
        let installedModels = [];
        let recommendedModels = ['gemma4:e4b', 'qwen3:14b', 'gemma3:12b', 'llama3.1:latest'];
        let preferredModel = 'gemma4:e4b';

        function selectedMode() {
            return document.querySelector('input[name="sessionMode"]:checked').value;
        }

        function selectedOllamaModel() {
            return ollamaModel.value || preferredModel;
        }

        function updateModeUI() {
            voiceSettings.classList.toggle('hidden', selectedMode() !== 'voice');
        }

        function updateStartButton() {
            startBtn.disabled = isBusy || !isPdfReady || !isOllamaReady;
        }

        function isModelInstalled(modelName) {
            return installedModels.includes(modelName);
        }

        function uniqueModels(models) {
            return [...new Set(models.filter(Boolean))];
        }

        function choosePreferredModel(currentValue) {
            if (currentValue && isModelInstalled(currentValue)) {
                return currentValue;
            }
            if (isModelInstalled(preferredModel)) {
                return preferredModel;
            }
            const recommendedInstalled = recommendedModels.find((modelName) => isModelInstalled(modelName));
            if (recommendedInstalled) {
                return recommendedInstalled;
            }
            return installedModels[0] || preferredModel;
        }

        function renderModelSelector() {
            const currentValue = ollamaModel.value;
            const selected = choosePreferredModel(currentValue);
            const models = uniqueModels([
                ...recommendedModels,
                ...installedModels,
                preferredModel,
                selected
            ]);

            ollamaModel.innerHTML = '';
            models.forEach((modelName) => {
                const option = document.createElement('option');
                const installed = isModelInstalled(modelName);
                option.value = modelName;
                option.textContent = installed
                    ? `${modelName} (installed)`
                    : `${modelName} (not installed)`;
                ollamaModel.appendChild(option);
            });

            ollamaModel.value = selected;
            updateModelStatus();
        }

        function updateModelStatus() {
            const modelName = selectedOllamaModel();
            const installed = isModelInstalled(modelName);

            if (installed) {
                modelHint.textContent = `Using ${modelName} for this session.`;
            } else {
                modelHint.textContent = `${modelName} is not installed yet. Run: ollama pull ${modelName}`;
            }

            isOllamaReady = installedModels.length > 0 && installed;
            updateStartButton();
        }

        modeInputs.forEach((input) => input.addEventListener('change', updateModeUI));
        ollamaModel.addEventListener('change', updateModelStatus);
        updateModeUI();

        // Check Ollama status on load
        async function checkHealth() {
            try {
                const response = await fetch('/health', {cache: 'no-store'});
                const data = await response.json();

                installedModels = data.available_models || [];
                recommendedModels = data.recommended_models || recommendedModels;
                preferredModel = data.default_model || data.ollama_model || preferredModel;
                renderModelSelector();

                if (data.ollama_connected && isModelInstalled(selectedOllamaModel())) {
                    ollamaStatus.className = 'status-indicator active';
                    ollamaText.textContent = `Ollama ready (${selectedOllamaModel()})`;
                    isOllamaReady = true;
                } else if (data.ollama_connected) {
                    ollamaStatus.className = 'status-indicator inactive';
                    ollamaText.textContent = `Ollama connected; selected model is not installed.`;
                    isOllamaReady = false;
                } else {
                    ollamaStatus.className = 'status-indicator inactive';
                    ollamaText.textContent = `Ollama not available at ${data.ollama_base_url || 'localhost:11434'}. Start it with ollama serve.`;
                    isOllamaReady = false;
                    installedModels = [];
                    renderModelSelector();
                }

                activeSessionMode = data.session_active ? data.mode : null;
                resumeBtn.classList.toggle('hidden', !activeSessionMode);
            } catch (error) {
                ollamaStatus.className = 'status-indicator inactive';
                ollamaText.textContent = 'Server not responding';
                isOllamaReady = false;
                resumeBtn.classList.add('hidden');
            } finally {
                updateStartButton();
            }
        }

        checkHealth();
        setInterval(checkHealth, 10000);
        recheckBtn.addEventListener('click', checkHealth);

        resumeBtn.addEventListener('click', () => {
            window.location.href = `/conversation?mode=${encodeURIComponent(activeSessionMode || 'text')}`;
        });

        // Upload area click
        uploadArea.addEventListener('click', () => fileInput.click());

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // Handle file upload
        async function handleFile(file) {
            uploadedFile = null;
            isPdfReady = false;
            updateStartButton();
            successMsg.classList.remove('visible');
            contextNotice.classList.remove('visible');
            fileInfo.classList.remove('visible');
            fileName.textContent = '';
            fileDetails.textContent = '';

            if (!file.name.toLowerCase().endsWith('.pdf')) {
                showError('Please upload a PDF file');
                return;
            }

            if (file.size > 10 * 1024 * 1024) {
                showError('File size must be less than 10MB');
                return;
            }

            uploadedFile = file;

            // Show file info
            fileName.textContent = file.name;
            fileDetails.textContent = `${(file.size / 1024).toFixed(1)} KB`;
            fileInfo.classList.add('visible');

            // Upload to server
            loading.classList.add('visible');
            loadingText.textContent = 'Processing PDF...';
            isBusy = true;
            updateStartButton();
            errorMsg.classList.remove('visible');
            successMsg.classList.remove('visible');
            contextNotice.classList.remove('visible');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload-pdf', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    isPdfReady = true;
                    showSuccess(data.message);
                    showContextNotice(data.context);
                } else {
                    isPdfReady = false;
                    showError(data.detail || 'Error processing PDF');
                }
            } catch (error) {
                isPdfReady = false;
                showError('Failed to upload PDF: ' + error.message);
            } finally {
                loading.classList.remove('visible');
                isBusy = false;
                updateStartButton();
            }
        }

        // Start session
        startBtn.addEventListener('click', async () => {
            loading.classList.add('visible');
            isBusy = true;
            updateStartButton();
            const mode = selectedMode();
            loadingText.textContent = mode === 'voice'
                ? 'Initializing Whisper model and session...'
                : 'Starting text chat session...';
            errorMsg.classList.remove('visible');

            try {
                const phraseTimeout = parseFloat(document.getElementById('phraseTimeout').value);
                const model = selectedOllamaModel();

                const response = await fetch('/start-session', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        mode: mode,
                        ollama_model: model,
                        whisper_model: 'base',
                        phrase_timeout: phraseTimeout
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Redirect to conversation page
                    window.location.href = `/conversation?mode=${encodeURIComponent(data.mode || mode)}`;
                } else {
                    showError(data.detail || 'Error starting session');
                    checkHealth();
                }
            } catch (error) {
                showError('Failed to start session: ' + error.message);
            } finally {
                loading.classList.remove('visible');
                isBusy = false;
                updateStartButton();
            }
        });

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.classList.add('visible');
            successMsg.classList.remove('visible');
        }

        function showSuccess(message) {
            successMsg.textContent = message;
            successMsg.classList.add('visible');
            errorMsg.classList.remove('visible');
        }

        function showContextNotice(context) {
            if (!context) {
                contextNotice.classList.remove('visible');
                return;
            }

            if (context.truncated) {
                contextNotice.textContent = `Pilot note: this essay appears to be ${context.total_words} words. `
                    + `For the current pilot, the assistant will work with the first ${context.word_limit} words.`;
                contextNotice.classList.add('visible');
                return;
            }

            if (context.extraction_method === 'ocr') {
                contextNotice.textContent = 'Imported using OCR because the PDF did not expose normal selectable text.';
                contextNotice.classList.add('visible');
                return;
            }

            contextNotice.classList.remove('visible');
        }
    </script>
</body>
</html>
